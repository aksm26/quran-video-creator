name = "qvc-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
QF_OAUTH = "https://oauth2.quran.foundation"
QF_API = "https://apis.quran.foundation"

# Per-IP limit, so nobody can burn the Quran Foundation quota through this proxy.
# 60/min keeps one IP under the free plan's 100k Worker requests a day (60 x 1440 = 86,400).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
